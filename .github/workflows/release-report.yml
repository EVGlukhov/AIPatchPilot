name: Release report

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main and full Git history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate report
        run: npm run release:report -- "$RELEASE_TAG" "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "docs/releases/${RELEASE_TAG}.md"
          set +e
          git diff --cached --quiet
          diff_status=$?
          set -e

          if [ "$diff_status" -eq 0 ]; then
            echo "No report changes to commit."
          elif [ "$diff_status" -eq 1 ]; then
            git commit -m "docs: add release report ${RELEASE_TAG}"
            git push origin HEAD:main
          else
            echo "git diff failed with exit code $diff_status" >&2
            exit "$diff_status"
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}
