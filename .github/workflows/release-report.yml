name: Release report

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main and full Git history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate report
        run: npm run release:report -- "$RELEASE_TAG" "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "docs/releases/${RELEASE_TAG}.md"
          git commit -m "docs: add release report ${RELEASE_TAG}"
          git push origin HEAD:main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
